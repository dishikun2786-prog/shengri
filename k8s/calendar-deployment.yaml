apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-engine
  namespace: shengri
  labels:
    app: calendar-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calendar-engine
  template:
    metadata:
      labels:
        app: calendar-engine
    spec:
      containers:
        - name: calendar
          image: registry.cn-hangzhou.aliyuncs.com/shengri/calendar-engine:latest
          ports:
            - containerPort: 8100
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-engine-service
  namespace: shengri
spec:
  selector:
    app: calendar-engine
  ports:
    - port: 8100
      targetPort: 8100
  type: ClusterIP
