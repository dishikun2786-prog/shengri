apiVersion: apps/v1
kind: Deployment
metadata:
  name: shengri-api
  namespace: shengri
  labels:
    app: shengri-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shengri-api
  template:
    metadata:
      labels:
        app: shengri-api
    spec:
      containers:
        - name: api
          image: registry.cn-hangzhou.aliyuncs.com/shengri/api:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shengri-secrets
                  key: database-url
            - name: REDIS_HOST
              value: redis-service
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shengri-secrets
                  key: jwt-secret
            - name: CALENDAR_ENGINE_URL
              value: http://calendar-engine-service:8100
            - name: DEFAULT_AI_PROVIDER
              value: minimax
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shengri-secrets
                  key: minimax-api-key
            - name: MINIMAX_BASE_URL
              value: https://api.minimaxi.com/v1/text/chatcompletion_v2
            - name: MINIMAX_MODEL
              value: MiniMax-M2.5
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shengri-secrets
                  key: openai-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shengri-secrets
                  key: deepseek-api-key
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: shengri
spec:
  selector:
    app: shengri-api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
