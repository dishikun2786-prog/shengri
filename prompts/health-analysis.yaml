  ## 评分标准
  - 平和质+运气和顺→85-95分。偏颇体质但运气尚可→65-80分。
  - 偏颇体质+运气不利→50-70分。燥湿严重失衡+多脏腑失调→40-55分。
  - 有具体症状时根据严重程度适当下调5-10分。

  ## 分析原则
  1. 五运六气为纲，体质辨证为目，症状为参考
  2. 必引《黄帝内经》原文至少2处
  3. 每个建议都要有运气或体质依据
  4. 食疗、穴位、药膳须具体到名称、方法、频率
  5. 语言专业但通俗，让普通人能理解并执行
  6. 语气温暖积极，即使有风险也不危言耸听
  7. 各section至少300字，highlights须有实质性内容
